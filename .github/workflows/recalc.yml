name: Recalculate dashboard

# Started by the ledger sheet (3514 -> Approve / Recalculate), by hand, or hourly to pick up fine payments.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: recalc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recalc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull ledger and recalculate
        run: python3 tracker/track.py --pull
      - name: Publish dashboard
        env:
          DEPLOY_KEY: ${{ secrets.DASHBOARD_DEPLOY_KEY }}
          DASHBOARD_REPO: ${{ github.repository_owner }}/rok-3514-dashboard
        run: sh tracker/publish_ci.sh
